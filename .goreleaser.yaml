# GoReleaser configuration for LANLeecher (same layout as FlowGauge).
# Documentation: https://goreleaser.com
#
# Release flow: create and publish a release with a tag vX.Y.Z in the GitHub
# web interface. .github/workflows/release.yml then builds, tests and attaches
# everything below to that release.

version: 2

project_name: lanleecher

builds:
  - id: lanleecher
    main: ./cmd/lanleecher
    binary: lanleecher
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    flags:
      - -trimpath
    # Reproducible: the test job and the publish job build bit-identical binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/lan-dot-party/lanleecher/pkg/version.Version={{.Version}}
      - -X github.com/lan-dot-party/lanleecher/pkg/version.Commit={{.ShortCommit}}
      - -X github.com/lan-dot-party/lanleecher/pkg/version.BuildDate={{.CommitDate}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE
      - configs/lanleecher.example.yaml
      - packaging/lanleecher.service

nfpms:
  - id: packages
    package_name: lanleecher
    file_name_template: >-
      {{ .PackageName }}_
      {{- .Version }}_
      {{- if eq .Arch "arm" }}armv7{{ else }}{{ .Arch }}{{ end }}
    vendor: lan-dot-party
    homepage: https://github.com/lan-dot-party/LANLeecher
    maintainer: lan-dot-party
    description: |-
      Traffic rankings per client for LAN parties.
      LANLeecher counts download and upload per MAC address via SNMP from the
      switches and serves rankings through a web UI, a beamer view and a REST API.
    license: MIT
    section: net
    formats:
      - deb
      - rpm
      - archlinux
      - apk
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    contents:
      - src: packaging/config.yaml
        dst: /etc/lanleecher/config.yaml
        type: config|noreplace
        file_info:
          mode: 0640
      - src: packaging/lanleecher.service
        dst: /usr/lib/systemd/system/lanleecher.service
        file_info:
          mode: 0644
      - src: packaging/lanleecher.sysusers
        dst: /usr/lib/sysusers.d/lanleecher.conf
        file_info:
          mode: 0644
      - src: configs/lanleecher.example.yaml
        dst: /usr/share/doc/lanleecher/config.example.yaml
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/lanleecher/README.md
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/licenses/lanleecher/LICENSE
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    overrides:
      deb:
        dependencies:
          - ca-certificates
      rpm:
        dependencies:
          - ca-certificates
      archlinux:
        dependencies:
          - ca-certificates
    archlinux:
      packager: lan-dot-party

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

# The repository is taken from the git remote / GITHUB_REPOSITORY, so the
# workflow works in Hornochs/LANLeecher as well as in lan-dot-party/LANLeecher.
release:
  # The release (and its notes) is created in the web interface; only add files.
  mode: keep-existing
  replace_existing_artifacts: true
  prerelease: auto

# One multi-arch image (amd64, arm64, armv7) on ghcr.io under the owner of the
# repository that builds it (ghcr.io/<owner>/lanleecher), like FlowGauge.
dockers_v2:
  - id: lanleecher
    ids: [lanleecher]
    dockerfile: Dockerfile.goreleaser
    images:
      - 'ghcr.io/{{ envOrDefault "GITHUB_REPOSITORY_OWNER" "lan-dot-party" | tolower }}/lanleecher'
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    extra_files:
      - packaging/docker-config.yaml
    labels:
      org.opencontainers.image.title: LANLeecher
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: https://github.com/lan-dot-party/LANLeecher
      org.opencontainers.image.licenses: MIT
