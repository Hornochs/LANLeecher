<!doctype html>
<!--
  LANLeecher OBS overlay: top downloaders and uploaders on a transparent background.

  OBS → Sources → Browser → "Local file" → this file, and append the settings as URL hash:
    file:///path/to/index.html#url=https://lanleecher.example&token=llk_…&limit=5&show=down

  Parameters:  url    LANLeecher base URL (required)
               token  API token with scope read:board (required)
               limit  10 (default), 20 or 50 – the overlay shows only "rows" of them
               rows   number of rows to show (default 5)
               show   down, up or both (default both)
  The token stays in the browser source; it only allows reading the board.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LANLeecher overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<section id="down" class="list"><h2>Top downloaders</h2><ol></ol></section>
<section id="up" class="list"><h2>Top uploaders</h2><ol></ol></section>
<p id="status"></p>
<script src="overlay.js"></script>
</body>
</html>
