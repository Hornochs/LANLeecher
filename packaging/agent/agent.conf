# LANLeecher agent – reports traffic per MAC of this host (and its Proxmox
# VE guests) to LANLeecher. Create the agent in LANLeecher under
# Admin → Agents; the page shows the token and a ready-made configuration.
# Then: sudo systemctl enable --now lanleecher-agent
# Documentation: https://github.com/lan-dot-party/LANLeecher/blob/main/docs/agent.md

# LANLeecher's address (its public_url). https:// is required; a valid
# certificate (e.g. behind a reverse proxy) needs no further settings.
server: https://lanleecher.example

# The agent token (llk_…) from Admin → Agents, or a file that holds it.
token: llk_REPLACE_ME
# token_file: /etc/lanleecher/agent.token

# Seconds between two reports (5s … 10m).
interval: 15s

# auto: Proxmox VE if /etc/pve/local exists, else linux.
mode: auto

# Optional filters on interface names (shell globs).
# interfaces:
#   include: []
#   exclude: ["wlan*"]

# Only for LANLeecher's built-in TLS with a self-signed certificate:
# tls:
#   pinned_sha256: ""       # shown under Admin → Agents
#   ca_file: ""             # or trust an internal CA
#   insecure_skip_verify: false   # never in production
# allow_insecure_http: false      # never in production
