{{define "content"}}
{{template "admin_nav" .}}
<h1>{{.T "admin.audit"}}</h1>
<section class="card">
<table>
  <thead><tr><th>{{.T "audit.when"}}</th><th>{{.T "audit.who"}}</th><th>{{.T "audit.action"}}</th><th>{{.T "audit.target"}}</th><th>{{.T "audit.details"}}</th><th>IP</th></tr></thead>
  <tbody>
  {{range .Data.Entries}}
  <tr><td class="nowrap">{{dt .At}}</td><td>{{.Actor}}</td><td><code>{{.Action}}</code></td><td>{{.Target}}</td><td class="small">{{.Details}}</td><td class="small">{{.IP}}</td></tr>
  {{else}}
  <tr><td colspan="6" class="muted">–</td></tr>
  {{end}}
  </tbody>
</table>
</section>
{{end}}
